<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNVbu2JsqcMIdfg7BJaItg8yssOJzxdOY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviarGrupo1 = function(valor){
  set(ref(db,'grupo1'), valor);
}

// ===== ANIMACIÓN =====
function mover(nombre, estado){
  const el = document.getElementById("cil_"+nombre);
  if(estado==="OUT"){
    el.style.transform="translateX(80px)";
  }else{
    el.style.transform="translateX(0px)";
  }
}

onValue(ref(db,'estado/A'), snap=> mover("A",snap.val()));
onValue(ref(db,'estado/B'), snap=> mover("B",snap.val()));
onValue(ref(db,'estado/C'), snap=> mover("C",snap.val()));
onValue(ref(db,'estado/D'), snap=> mover("D",snap.val()));

</script>

<body>
