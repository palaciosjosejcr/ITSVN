<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASSWORD = "admin123";

let esAdmin = false;
let tiempoRestante = 60;
let temporizador = null;
let bloqueado = localStorage.getItem("bloqueado") === "true";


// ================= TIMER =================

function actualizarTimer(){
  document.getElementById("timer").innerText = tiempoRestante;
}

function iniciarTemporizador(){
  temporizador = setInterval(()=>{
    tiempoRestante--;
    actualizarTimer();

    if(tiempoRestante <= 0){
      clearInterval(temporizador);
      bloquearSistema();
    }
  },1000);
}


// ================= BLOQUEO =================

function bloquearSistema(){
  bloqueado = true;
  localStorage.setItem("bloqueado","true");
  document.getElementById("bloqueo").style.display="flex";
  desactivarBotones();
}

function desbloquearSistema(){
  bloqueado = false;
  localStorage.setItem("bloqueado","false");
  tiempoRestante = 60;
  actualizarTimer();
  temporizador = null;
  document.getElementById("bloqueo").style.display="none";
  activarBotones();
}

function activarBotones(){
  document.querySelectorAll(".botonUser").forEach(b=>b.disabled=false);
}

function desactivarBotones(){
  document.querySelectorAll(".botonUser").forEach(b=>b.disabled=true);
}


// ================= LOGIN =================

window.login = function(){
  const pass = document.getElementById("password").value;

  if(pass === ADMIN_PASSWORD){
      esAdmin = true;
      document.getElementById("adminPanel").style.display="block";
      document.getElementById("loginBox").style.display="none";
      activarBotones();
      document.getElementById("password").value="";
      return;
  }

  alert("Contraseña incorrecta");
  document.getElementById("password").value="";
}


// ================= DESBLOQUEO ADMIN =================

window.desbloqueoAdmin = function(){
  const pass = document.getElementById("adminUnlock").value;

  if(pass === ADMIN_PASSWORD){
      desbloquearSistema();
      document.getElementById("adminUnlock").value="";
      return;
  }

  alert("Contraseña incorrecta");
  document.getElementById("adminUnlock").value="";
}


// ================= ENVÍO SECUENCIAS (CON BLOQUEO TEMPORAL) =================

function enviar(ruta, valor){

  if(bloqueado) return;

  if(!esAdmin && temporizador === null){
      iniciarTemporizador();
  }

  // 🔥 BLOQUEAR BOTONES INMEDIATAMENTE
  desactivarBotones();

  set(ref(db,ruta),valor);

  // 🔥 TIEMPO DE BLOQUEO (AJUSTABLE)
  setTimeout(()=>{
    if(!bloqueado){
      activarBotones();
    }
  }, 4000); // 4 segundos (puedes subir a 5000 si quieres)
}

window.enviarGrupo1 = v => enviar("grupo1",v);
window.enviarGrupo2 = v => enviar("grupo2",v);


// ================= ADMIN CONTROLES =================

window.controlAdmin = function(num){

  if(!esAdmin) return;

  desactivarBotones();

  if(num==1){ enviar("grupo1",1); enviar("grupo2",5); }
  if(num==2){ enviar("grupo1",2); enviar("grupo2",6); }
  if(num==3){ enviar("grupo1",3); enviar("grupo2",7); }
  if(num==4){ enviar("grupo1",4); enviar("grupo2",8); }

  setTimeout(()=>{
    if(!bloqueado){
      activarBotones();
    }
  }, 5000);
}


// ================= SISTEMA DE LIKES =================

const likesRef = ref(db, "likes");
const dislikesRef = ref(db, "dislikes");

onValue(likesRef, (snapshot) => {
  document.getElementById("likes").innerText = snapshot.val() || 0;
});

onValue(dislikesRef, (snapshot) => {
  document.getElementById("dislikes").innerText = snapshot.val() || 0;
});

window.darLike = async function(){
  const snapshot = await get(likesRef);
  const actual = snapshot.val() || 0;
  await set(likesRef, actual + 1);
}

window.darDislike = async function(){
  const snapshot = await get(dislikesRef);
  const actual = snapshot.val() || 0;
  await set(dislikesRef, actual + 1);
}


// ================= CARGA INICIAL =================

window.onload = function(){
  actualizarTimer();
  if(bloqueado){
    document.getElementById("bloqueo").style.display="flex";
    desactivarBotones();
  }
}
</script>
