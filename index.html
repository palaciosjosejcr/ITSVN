<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TECNOLOGICO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASSWORD = "admin123";

let esAdmin = false;
let tiempoRestante = 60;
let temporizador = null;
let bloqueado = localStorage.getItem("bloqueado") === "true";

// ===== TIMER =====
function actualizarTimer(){
  document.getElementById("timer").innerText = tiempoRestante;
}

function iniciarTemporizador(){
  temporizador = setInterval(()=>{
    tiempoRestante--;
    actualizarTimer();
    if(tiempoRestante <= 0){
      clearInterval(temporizador);
      bloquearSistema();
    }
  },1000);
}

// ===== BLOQUEO POR TIEMPO =====
function bloquearSistema(){
  bloqueado = true;
  localStorage.setItem("bloqueado","true");
  document.getElementById("bloqueo").style.display="flex";
}

function desbloquearSistema(){
  bloqueado = false;
  localStorage.setItem("bloqueado","false");
  tiempoRestante = 60;
  actualizarTimer();
  temporizador = null;
  document.getElementById("bloqueo").style.display="none";
}

// ===== ENVÍO =====
function enviar(ruta, valor){
  if(bloqueado) return;

  if(!esAdmin && temporizador === null){
      iniciarTemporizador();
  }

  set(ref(db,ruta),valor);
}

window.enviarGrupo1 = v => enviar("grupo1",v);
window.enviarGrupo2 = v => enviar("grupo2",v);

// ===== LOGIN =====
window.login = function(){
  const pass = document.getElementById("password").value;
  if(pass === ADMIN_PASSWORD){
      esAdmin = true;
      document.getElementById("adminPanel").style.display="block";
      document.getElementById("loginBox").style.display="none";
      document.getElementById("password").value="";
  } else {
      alert("Contraseña incorrecta");
      document.getElementById("password").value="";
  }
};

window.desbloqueoAdmin = function(){
  const pass = document.getElementById("adminUnlock").value;
  if(pass === ADMIN_PASSWORD){
      desbloquearSistema();
      document.getElementById("adminUnlock").value="";
  } else {
      alert("Contraseña incorrecta");
      document.getElementById("adminUnlock").value="";
  }
};

// ===== ADMIN CONTROLES =====
window.controlAdmin = function(num){
  if(!esAdmin) return;
  if(num==1){ enviar("grupo1",1); enviar("grupo2",5); }
  if(num==2){ enviar("grupo1",2); enviar("grupo2",6); }
  if(num==3){ enviar("grupo1",3); enviar("grupo2",7); }
  if(num==4){ enviar("grupo1",4); enviar("grupo2",8); }
};

// ===== LIKES =====
const likesRef = ref(db,"likes");
const dislikesRef = ref(db,"dislikes");

onValue(likesRef, s=>{
  document.getElementById("likes").innerText = s.val() || 0;
});
onValue(dislikesRef, s=>{
  document.getElementById("dislikes").innerText = s.val() || 0;
});

window.darLike = async ()=>{
  const snap = await get(likesRef);
  await set(likesRef,(snap.val()||0)+1);
};

window.darDislike = async ()=>{
  const snap = await get(dislikesRef);
  await set(dislikesRef,(snap.val()||0)+1);
};

window.onload = function(){
  actualizarTimer();
  if(bloqueado){
    document.getElementById("bloqueo").style.display="flex";
  }
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;

  background:
    linear-gradient(
      rgba(15,12,41,0.85),
      rgba(58,0,114,0.85),
      rgba(26,0,51,0.85)
    ),
    url("./logo.png");

  background-size:70vh;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 15px cyan;
}

.container{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:40px;
  max-width:1400px;
  margin:auto;
  gap:40px;
}

.left{
  flex:1;
}

.right{
  width:350px;
  background:rgba(255,255,255,0.08);
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 20px magenta;
}

button{
  padding:14px 20px;
  margin:10px;
  border:none;
  border-radius:12px;
  background:#1f1c2c;
  color:white;
  font-size:15px;
  box-shadow:0 0 10px cyan;
  cursor:pointer;
}

button:hover{
  background:cyan;
  color:black;
}

#adminPanel{
  display:none;
  margin-top:20px;
}

#bloqueo{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#000000,#1a0033,#000000);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:20px;
  z-index:9999;
}

/* ===== MODO CELULAR ===== */
@media (max-width:900px){
  .container{
    flex-direction:column;
    align-items:center;
  }

  .right{
    width:90%;
    margin-top:20px;
  }

  button{
    width:90%;
  }
}
</style>
</head>

<body>

<header>TECNOLOGICO UNIVERSITARIO VIDA NUEVA</header>

<div class="container">

<div class="left">

<div id="loginBox">
<h3>Acceso Administrador</h3>
<input type="password" id="password" placeholder="Ingrese contraseña">
<button onclick="login()">Ingresar</button>
</div>

<h3>Tiempo restante: <span id="timer">60</span> segundos</h3>

<h3>¿Te gustó el proyecto?</h3>
<button onclick="darLike()">👍 Me gusta</button>
<span id="likes">0</span>
<button onclick="darDislike()">👎 No me gusta</button>
<span id="dislikes">0</span>

<h2>Grupo A-D</h2>
<button onclick="enviarGrupo1(1)">Secuencia 1</button>
<button onclick="enviarGrupo1(2)">Secuencia 2</button>
<button onclick="enviarGrupo1(3)">Secuencia 3</button>
<button onclick="enviarGrupo1(4)">Secuencia 4</button>

<h2>Grupo E-H</h2>
<button onclick="enviarGrupo2(5)">Secuencia 5</button>
<button onclick="enviarGrupo2(6)">Secuencia 6</button>
<button onclick="enviarGrupo2(7)">Secuencia 7</button>
<button onclick="enviarGrupo2(8)">Secuencia 8</button>

<div id="adminPanel">
<h2>Panel Admin</h2>
<button onclick="controlAdmin(1)">Control Admin 1</button>
<button onclick="controlAdmin(2)">Control Admin 2</button>
<button onclick="controlAdmin(3)">Control Admin 3</button>
<button onclick="controlAdmin(4)">Control Admin 4</button>
</div>

</div>

<div class="right">
<h3>Escanea para acceder</h3>
<img src="qr_github.png" width="200">
<p>Comparte esta página</p>
</div>

</div>

<div id="bloqueo">
<h2>⛔ Tiempo terminado</h2>
<input type="password" id="adminUnlock" placeholder="Contraseña administrador">
<br><br>
<button onclick="desbloqueoAdmin()">Desbloquear</button>
</div>

</body>
</html>
