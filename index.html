<!DOCTYPE html>
<html>
<head>

<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNVbu2JsqcMIdfg7BJaItg8yssOJzxdOY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviarGrupo1 = function(v){
  set(ref(db,'grupo1'),v);
}

function mover(nombre,estado){
  const el=document.getElementById("cil_"+nombre);
  if(estado==="OUT"){
    el.style.transform="translateX(80px)";
  }else{
    el.style.transform="translateX(0px)";
  }
}

// ESCUCHAR TODOS
["A","B","C","D","E","F","G","H"].forEach(c=>{
  onValue(ref(db,'estado/'+c),(snap)=>{
    if(snap.val()) mover(c,snap.val());
  });
});

</script>

<style>
body{
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);

  font-family:Arial;

}

.sim{

.cil{

}

.barra{
  width:80px;
  height:20px;
  background:#ff00ff;
  transition:0.5s;
}
</style>
</head>

<body>

<h1>INSTITUTO UNIVERSITARIO VIDA NUEVA</h1>

<button onclick="enviarGrupo1(1)">Secuencia Demo</button>
