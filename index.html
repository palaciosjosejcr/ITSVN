<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== FUNCIONES NORMALES =====
window.enviarGrupo1 = function(valor){
  set(ref(db,'grupo1'), valor);
}

window.enviarGrupo2 = function(valor){
  set(ref(db,'grupo2'), valor);
}

// ===== FUNCIONES ADMIN =====
window.enviarAdmin = function(valor){
  set(ref(db,'admin'), valor);
  simularAdmin();
}

// ===== SIMULACIÓN VISUAL =====
window.simularAdmin = function(){

  document.getElementById("simulacion").style.display = "block";

  const lista = ["A","B","C","D","E","F","G","H"];

  lista.forEach((id, index)=>{
    setTimeout(()=>{
      document.getElementById(id).classList.add("activo");
    }, index * 300);
  });

  setTimeout(()=>{
    lista.forEach(id=>{
      document.getElementById(id).classList.remove("activo");
    });
  }, 5000);
}
</script>

<!-- ================= CSS ================= -->
<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a0033,#3a0072,#0f0c29);
  color:white;
  text-align:center;
}

header{
  padding:20px;
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 15px #00f2ff;
}

button{
  padding:12px 25px;
  margin:10px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1f1c2c;
  color:white;
  box-shadow:0 0 15px #00f2ff;
  transition:0.3s;
}

button:hover{
  background:#00f2ff;
  color:black;
}

.admin{
  background:#ff00ff;
  box-shadow:0 0 20px #ff00ff;
}

.qr{
  margin-top:30px;
}

/* ===== SIMULACIÓN ===== */

.simulacion{
  margin-top:40px;
  display:none;
}

.cilindro{
  width:200px;
  height:20px;
  background:#222;
  margin:10px auto;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}

.cilindro::after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0%;
  background:#00f2ff;
  transition:1s;
}

.cilindro.activo::after{
  width:100%;
}

</style>
</head>

<body>

<header>
INSTITUTO UNIVERSITARIO VIDA NUEVA
</header>

<h2>Grupo A - D</h2>
<button onclick="enviarGrupo1(1)">Secuencia 1</button>
<button onclick="enviarGrupo1(2)">Secuencia 2</button>
<button onclick="enviarGrupo1(3)">Secuencia 3</button>
<button onclick="enviarGrupo1(4)">Secuencia 4</button>

<h2>Grupo E - H</h2>
<button onclick="enviarGrupo2(5)">Secuencia 5</button>
<button onclick="enviarGrupo2(6)">Secuencia 6</button>
<button onclick="enviarGrupo2(7)">Secuencia 7</button>
<button onclick="enviarGrupo2(8)">Secuencia 8</button>

<h2>Controles Administrador</h2>
<button class="admin" onclick="enviarAdmin('I')">Control Admin 1</button>
<button class="admin" onclick="enviarAdmin('J')">Control Admin 2</button>
<button class="admin" onclick="enviarAdmin('K')">Control Admin 3</button>
<button class="admin" onclick="enviarAdmin('L')">Control Admin 4</button>

<div class="qr">
<h3>Escanea para acceder</h3>
<img src="qr_github.png" width="200">
</div>

<div class="simulacion" id="simulacion">
<h2>Simulación de Válvulas</h2>

<div class="cilindro" id="A"></div>
<div class="cilindro" id="B"></div>
<div class="cilindro" id="C"></div>
<div class="cilindro" id="D"></div>

<div class="cilindro" id="E"></div>
<div class="cilindro" id="F"></div>
<div class="cilindro" id="G"></div>
<div class="cilindro" id="H"></div>

</div>

</body>
</html>
