<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNVbu2JsqcMIdfg7BJaItg8yssOJzxdOY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.appspot.com",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= CONTRASEÑAS =================
const ADMIN_PASS = "admin123";
const USER_PASS = "usuario123";

let tiempo = 60;
let timer = null;
let bloqueado = localStorage.getItem("bloqueado");

// ================= LOGIN =================
window.login = function(){

  let pass = document.getElementById("password").value;

  if(pass === ADMIN_PASS){
    desbloquear();
    activarBotones(true);
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("password").value="";
    document.getElementById("estadoLogin").innerText="Modo Administrador";
    return;
  }

  if(pass === USER_PASS && bloqueado !== "true"){
    activarBotones(true);
    document.getElementById("adminPanel").style.display="none";
    iniciarTemporizador();
    document.getElementById("password").value="";
    document.getElementById("estadoLogin").innerText="Modo Usuario";
    return;
  }

  document.getElementById("password").value="";
  alert("Contraseña incorrecta o usuario bloqueado");
}

// ================= TEMPORIZADOR =================
function iniciarTemporizador(){
  tiempo = 60;
  document.getElementById("timer").innerText = tiempo;

  timer = setInterval(()=>{
    tiempo--;
    document.getElementById("timer").innerText = tiempo;

    if(tiempo <= 0){
      clearInterval(timer);
      bloquear();
    }
  },1000);
}

// ================= BLOQUEO =================
function bloquear(){
  activarBotones(false);
  localStorage.setItem("bloqueado","true");
  bloqueado="true";
  document.getElementById("overlay").style.display="flex";
}

function desbloquear(){
  activarBotones(true);
  localStorage.setItem("bloqueado","false");
  bloqueado="false";
  document.getElementById("overlay").style.display="none";
}

// ================= BOTONES =================
function activarBotones(valor){
  document.querySelectorAll("button.control").forEach(b=>{
    b.disabled = !valor;
  });
}

// ================= ENVÍO FIREBASE =================
window.enviarGrupo1 = v => set(ref(db,'grupo1'),v);
window.enviarGrupo2 = v => set(ref(db,'grupo2'),v);

window.admin1 = ()=>{ set(ref(db,'grupo1'),1); set(ref(db,'grupo2'),5); }
window.admin2 = ()=>{ set(ref(db,'grupo1'),2); set(ref(db,'grupo2'),6); }
window.admin3 = ()=>{ set(ref(db,'grupo1'),3); set(ref(db,'grupo2'),7); }
window.admin4 = ()=>{ set(ref(db,'grupo1'),4); set(ref(db,'grupo2'),8); }

// ================= SIMULACIÓN =================
["A","B","C","D","E","F","G","H"].forEach(l=>{
  onValue(ref(db,"estado/"+l),(snap)=>{
    if(snap.exists()){
      let el=document.getElementById("cil"+l);
      if(snap.val()=="OUT"){
        el.classList.add("activo");
      }else{
        el.classList.remove("activo");
      }
    }
  });
});

// Estado inicial
if(bloqueado === "true"){
  bloquear();
}else{
  activarBotones(false);
}
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a0033,#3a0072,#0f0c29);
  color:white;
  text-align:center;
}

h1{
  padding:20px;
  text-shadow:0 0 15px #00f2ff;
}

button{
  padding:12px 20px;
  margin:8px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#1f1c2c;
  color:white;
  box-shadow:0 0 15px #00f2ff;
}

button:disabled{
  opacity:0.3;
}

.admin{
  background:#ff00ff;
  box-shadow:0 0 15px #ff00ff;
}

.sim{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:30px;
  padding:40px;
}

.cil{
  width:120px;
  height:20px;
  background:#ff00ff;
  border-radius:10px;
  transition:0.4s;
  margin:auto;
}

.activo{
  transform:translateX(40px);
  background:#00ff99;
}

#overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.qr img{
  width:160px;
}
</style>
</head>

<body>

<h1>INSTITUTO UNIVERSITARIO VIDA NUEVA</h1>

<h3>Acceso</h3>
<input type="password" id="password" placeholder="Ingrese contraseña">
<button onclick="login()">Ingresar</button>
<p id="estadoLogin"></p>
<p>Tiempo restante: <span id="timer">0</span> segundos</p>

<h2>Grupo A - D</h2>
<button class="control" onclick="enviarGrupo1(1)">Secuencia 1</button>
<button class="control" onclick="enviarGrupo1(2)">Secuencia 2</button>
<button class="control" onclick="enviarGrupo1(3)">Secuencia 3</button>
<button class="control" onclick="enviarGrupo1(4)">Secuencia 4</button>

<h2>Grupo E - H</h2>
<button class="control" onclick="enviarGrupo2(5)">Secuencia 5</button>
<button class="control" onclick="enviarGrupo2(6)">Secuencia 6</button>
<button class="control" onclick="enviarGrupo2(7)">Secuencia 7</button>
<button class="control" onclick="enviarGrupo2(8)">Secuencia 8</button>

<div id="adminPanel" style="display:none;">
<h2>Controles Administrador</h2>
<button class="control admin" onclick="admin1()">Control Admin 1</button>
<button class="control admin" onclick="admin2()">Control Admin 2</button>
<button class="control admin" onclick="admin3()">Control Admin 3</button>
<button class="control admin" onclick="admin4()">Control Admin 4</button>
</div>

<div class="qr">
<h3>Escanea para acceder</h3>
<img src="qr_github.png">
</div>

<h2>Simulación</h2>
<div class="sim">
<div><div id="cilA" class="cil"></div><p>A</p></div>
<div><div id="cilB" class="cil"></div><p>B</p></div>
<div><div id="cilC" class="cil"></div><p>C</p></div>
<div><div id="cilD" class="cil"></div><p>D</p></div>
<div><div id="cilE" class="cil"></div><p>E</p></div>
<div><div id="cilF" class="cil"></div><p>F</p></div>
<div><div id="cilG" class="cil"></div><p>G</p></div>
<div><div id="cilH" class="cil"></div><p>H</p></div>
</div>

<div id="overlay">
<h2>Tiempo terminado</h2>
<p>Solo administrador puede desbloquear</p>
<input type="password" id="passwordUnlock" placeholder="Clave admin">
<button onclick="if(document.getElementById('passwordUnlock').value===ADMIN_PASS){desbloquear();document.getElementById('passwordUnlock').value='';}">Desbloquear</button>
</div>

</body>
</html>
