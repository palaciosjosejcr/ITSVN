<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TECNOLOGICO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASSWORD = "admin123";

let esAdmin = false;
let tiempoRestante = 60;
let temporizador = null;
let bloqueado = localStorage.getItem("bloqueado") === "true";
let secuenciaEnProceso = false;


// ================= TIMER =================
function actualizarTimer(){
  document.getElementById("timer").innerText = tiempoRestante;
}

function iniciarTemporizador(){
  temporizador = setInterval(()=>{
    tiempoRestante--;
    actualizarTimer();
    if(tiempoRestante <= 0){
      clearInterval(temporizador);
      bloquearSistema();
    }
  },1000);
}


// ================= BLOQUEO GENERAL =================
function bloquearSistema(){
  bloqueado = true;
  localStorage.setItem("bloqueado","true");
  document.getElementById("bloqueo").style.display="flex";
  desactivarBotones();
}

function desbloquearSistema(){
  bloqueado = false;
  localStorage.setItem("bloqueado","false");
  tiempoRestante = 60;
  actualizarTimer();
  temporizador = null;
  document.getElementById("bloqueo").style.display="none";
  activarBotones();
}


// ================= BOTONES =================
function activarBotones(){
  secuenciaEnProceso = false;

  const textos = [
    "Secuencia 1","Secuencia 2","Secuencia 3","Secuencia 4",
    "Secuencia 5","Secuencia 6","Secuencia 7","Secuencia 8"
  ];

  document.querySelectorAll(".botonUser").forEach((b,i)=>{
    b.disabled = false;
    b.innerText = textos[i];
    b.style.background = "#1f1c2c";
    b.style.boxShadow = "0 0 10px cyan";
  });
}

function desactivarBotones(){
  secuenciaEnProceso = true;

  document.querySelectorAll(".botonUser").forEach(b=>{
    b.disabled = true;
    b.innerText = "EJECUTANDO...";
    b.style.background = "#8b0000";
    b.style.boxShadow = "0 0 15px red";
  });
}


// ================= ENVÍO SECUENCIA =================
function enviar(ruta, valor){

  if(bloqueado || secuenciaEnProceso) return;

  if(!esAdmin && temporizador === null){
      iniciarTemporizador();
  }

  desactivarBotones();
  set(ref(db,ruta),valor);
}

window.enviarGrupo1 = v => enviar("grupo1",v);
window.enviarGrupo2 = v => enviar("grupo2",v);


// ================= DESBLOQUEO CUANDO ESP TERMINA =================
onValue(ref(db,"grupo1"), snapshot=>{
  if(secuenciaEnProceso && snapshot.val() === 0){
    activarBotones();
  }
});

onValue(ref(db,"grupo2"), snapshot=>{
  if(secuenciaEnProceso && snapshot.val() === 0){
    activarBotones();
  }
});


// ================= LOGIN =================
window.login = function(){
  const pass = document.getElementById("password").value;
  if(pass === ADMIN_PASSWORD){
      esAdmin = true;
      document.getElementById("adminPanel").style.display="block";
      document.getElementById("loginBox").style.display="none";
      activarBotones();
      document.getElementById("password").value="";
  } else {
      alert("Contraseña incorrecta");
      document.getElementById("password").value="";
  }
};


// ================= LIKES =================
const likesRef = ref(db,"likes");
const dislikesRef = ref(db,"dislikes");

onValue(likesRef, s=>{
  document.getElementById("likes").innerText = s.val() || 0;
});
onValue(dislikesRef, s=>{
  document.getElementById("dislikes").innerText = s.val() || 0;
});

window.darLike = async ()=>{
  const snap = await get(likesRef);
  await set(likesRef,(snap.val()||0)+1);
};

window.darDislike = async ()=>{
  const snap = await get(dislikesRef);
  await set(dislikesRef,(snap.val()||0)+1);
};

</script>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;

  background: linear-gradient(
    rgba(15,12,41,0.9),
    rgba(58,0,114,0.9),
    rgba(26,0,51,0.9)
  ), url("./logo.png");

  background-size:600px;
  background-repeat:no-repeat;
  background-position:center;
  background-attachment:fixed;
}

header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 15px cyan;
}

button{
  padding:12px;
  margin:8px;
  border:none;
  border-radius:10px;
  background:#1f1c2c;
  color:white;
  box-shadow:0 0 10px cyan;
  cursor:pointer;
}

button:hover{
  background:cyan;
  color:black;
}
</style>
</head>

<body>

<header>TECNOLOGICO UNIVERSITARIO VIDA NUEVA</header>

<h3 style="text-align:center">¿Te gustó el proyecto?</h3>
<div style="text-align:center;">
<button onclick="darLike()">👍 Me gusta</button>
<span id="likes">0</span>
<button onclick="darDislike()">👎 No me gusta</button>
<span id="dislikes">0</span>
</div>

<h2>Grupo A-D</h2>
<button class="botonUser" onclick="enviarGrupo1(1)">Secuencia 1</button>
<button class="botonUser" onclick="enviarGrupo1(2)">Secuencia 2</button>
<button class="botonUser" onclick="enviarGrupo1(3)">Secuencia 3</button>
<button class="botonUser" onclick="enviarGrupo1(4)">Secuencia 4</button>

<h2>Grupo E-H</h2>
<button class="botonUser" onclick="enviarGrupo2(5)">Secuencia 5</button>
<button class="botonUser" onclick="enviarGrupo2(6)">Secuencia 6</button>
<button class="botonUser" onclick="enviarGrupo2(7)">Secuencia 7</button>
<button class="botonUser" onclick="enviarGrupo2(8)">Secuencia 8</button>

</body>
</html>
