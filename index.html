<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNVbu2JsqcMIdfg7BJaItg8yssOJzxdOY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.rol = "bloqueado"; // Estado inicial

// 🔐 LOGIN
window.login = function(){
  const pass = document.getElementById("password").value;
  const mensaje = document.getElementById("mensajeLogin");

  if(pass === "admin123"){
    window.rol = "admin";
    mensaje.innerText = "Modo Administrador Activado";
    mensaje.style.color = "lime";
    activarBotones();
  }
  else if(pass === "user123"){
    window.rol = "usuario";
    mensaje.innerText = "Modo Usuario Activado";
    mensaje.style.color = "cyan";
    activarBotones();
  }
  else{
    mensaje.innerText = "❌ Contraseña incorrecta";
    mensaje.style.color = "red";
  }
}

// 🔓 Activar botones
function activarBotones(){
  const botones = document.querySelectorAll(".controlBtn");
  botones.forEach(btn => btn.disabled = false);
}

// 🚀 Enviar datos
window.enviarGrupo1 = function(valor){

  if(window.rol === "bloqueado"){
    alert("Debe iniciar sesión primero");
    return;
  }

  if(valor === 4 && window.rol !== "admin"){
    alert("Solo el administrador puede ejecutar la Secuencia 4");
    return;
  }

  set(ref(db,'grupo1'), valor);
}

window.enviarGrupo2 = function(valor){

  if(window.rol === "bloqueado"){
    alert("Debe iniciar sesión primero");
    return;
  }

  set(ref(db,'grupo2'), valor);
}

</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a0033,#3a0072,#0f0c29);
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
  text-shadow:0 0 15px #00f2ff;
}

.container{
  display:flex;
  justify-content:space-between;
  padding:40px;
}

.botones{
  width:50%;
}

button{
  width:90%;
  padding:15px;
  margin:10px;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#1f1c2c;
  color:white;
  box-shadow:0 0 15px #00f2ff;
  transition:0.3s;
}

button:disabled{
  background:#444;
  box-shadow:none;
  cursor:not-allowed;
  opacity:0.5;
}

button:hover:not(:disabled){
  background:#00f2ff;
  color:black;
  transform:scale(1.05);
}

.qr{
  width:40%;
  text-align:center;
  background:rgba(255,255,255,0.1);
  padding:20px;
  border-radius:15px;
  box-shadow:0 0 20px #ff00ff;
}

.qr img{
  width:200px;
}

#loginBox{
  text-align:center;
  margin-bottom:20px;
}

#password{
  padding:10px;
  border-radius:8px;
  border:none;
  width:200px;
}

#mensajeLogin{
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
INSTITUTO UNIVERSITARIO VIDA NUEVA
</header>

<div id="loginBox">
  <h3>Acceso al Sistema</h3>
  <input type="password" id="password" placeholder="Ingrese contraseña">
  <button onclick="login()">Ingresar</button>
  <p id="mensajeLogin"></p>
</div>

<div class="container">

<div class="botones">

<h2>Grupo A - D</h2>
<button class="controlBtn" disabled onclick="enviarGrupo1(1)">Secuencia 1</button>
<button class="controlBtn" disabled onclick="enviarGrupo1(2)">Secuencia 2</button>
<button class="controlBtn" disabled onclick="enviarGrupo1(3)">Secuencia 3</button>
<button class="controlBtn" disabled onclick="enviarGrupo1(4)">Secuencia 4 (Admin)</button>

<h2>Grupo E - H</h2>
<button class="controlBtn" disabled onclick="enviarGrupo2(5)">Secuencia 5</button>
<button class="controlBtn" disabled onclick="enviarGrupo2(6)">Secuencia 6</button>
<button class="controlBtn" disabled onclick="enviarGrupo2(7)">Secuencia 7</button>
<button class="controlBtn" disabled onclick="enviarGrupo2(8)">Secuencia 8</button>

</div>

<div class="qr">
<h3>Escanea para acceder</h3>
<img src="qr_github.png">
<p>Comparte esta página</p>
</div>

</div>

</body>
</html>
