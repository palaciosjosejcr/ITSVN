<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>INSTITUTO UNIVERSITARIO VIDA NUEVA</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNVbu2JsqcMIdfg7BJaItg8yssOJzxdOY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.appspot.com",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// BOTONES
window.enviarGrupo1 = (v)=> set(ref(db,'grupo1'),v);
window.enviarGrupo2 = (v)=> set(ref(db,'grupo2'),v);

// ADMIN combinados
window.admin1 = ()=>{
  set(ref(db,'grupo1'),1);
  set(ref(db,'grupo2'),5);
}
window.admin2 = ()=>{
  set(ref(db,'grupo1'),2);
  set(ref(db,'grupo2'),6);
}
window.admin3 = ()=>{
  set(ref(db,'grupo1'),3);
  set(ref(db,'grupo2'),7);
}
window.admin4 = ()=>{
  set(ref(db,'grupo1'),4);
  set(ref(db,'grupo2'),8);
}

// ESCUCHAR ESTADOS
const letras = ["A","B","C","D","E","F","G","H"];

letras.forEach(l=>{
  onValue(ref(db,"estado/"+l),(snap)=>{
    if(snap.exists()){
      let valor = snap.val();
      let el = document.getElementById("cil"+l);
      if(valor=="OUT"){
        el.classList.add("activo");
      }else{
        el.classList.remove("activo");
      }
    }
  });
});
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1a0033,#3a0072,#0f0c29);
  color:white;
  text-align:center;
}

h1{
  padding:20px;
  text-shadow:0 0 15px #00f2ff;
}

button{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#1f1c2c;
  color:white;
  box-shadow:0 0 15px #00f2ff;
  transition:0.3s;
}

button:hover{
  background:#00f2ff;
  color:black;
}

.admin{
  background:#ff00ff;
  box-shadow:0 0 15px #ff00ff;
}

.qr img{
  width:180px;
}

.simulacion{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:40px;
  padding:40px;
}

.cilindro{
  width:120px;
  height:20px;
  background:#ff00ff;
  border-radius:10px;
  transition:0.4s;
  margin:auto;
}

.activo{
  transform:translateX(40px);
  background:#00ff99;
}
</style>
</head>

<body>

<h1>INSTITUTO UNIVERSITARIO VIDA NUEVA</h1>

<h2>Grupo A - D</h2>
<button onclick="enviarGrupo1(1)">Secuencia 1</button>
<button onclick="enviarGrupo1(2)">Secuencia 2</button>
<button onclick="enviarGrupo1(3)">Secuencia 3</button>
<button onclick="enviarGrupo1(4)">Secuencia 4</button>

<h2>Grupo E - H</h2>
<button onclick="enviarGrupo2(5)">Secuencia 5</button>
<button onclick="enviarGrupo2(6)">Secuencia 6</button>
<button onclick="enviarGrupo2(7)">Secuencia 7</button>
<button onclick="enviarGrupo2(8)">Secuencia 8</button>

<h2>Controles Administrador</h2>
<button class="admin" onclick="admin1()">Control Admin 1</button>
<button class="admin" onclick="admin2()">Control Admin 2</button>
<button class="admin" onclick="admin3()">Control Admin 3</button>
<button class="admin" onclick="admin4()">Control Admin 4</button>

<div class="qr">
<h3>Escanea para acceder</h3>
<img src="qr_github.png">
</div>

<h2>Simulación de Válvulas</h2>

<div class="simulacion">
<div>
<div id="cilA" class="cilindro"></div><p>A</p>
</div>
<div>
<div id="cilB" class="cilindro"></div><p>B</p>
</div>
<div>
<div id="cilC" class="cilindro"></div><p>C</p>
</div>
<div>
<div id="cilD" class="cilindro"></div><p>D</p>
</div>
<div>
<div id="cilE" class="cilindro"></div><p>E</p>
</div>
<div>
<div id="cilF" class="cilindro"></div><p>F</p>
</div>
<div>
<div id="cilG" class="cilindro"></div><p>G</p>
</div>
<div>
<div id="cilH" class="cilindro"></div><p>H</p>
</div>
</div>

</body>
</html>
