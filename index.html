<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "control-f7416.firebaseapp.com",
  databaseURL: "https://control-f7416-default-rtdb.firebaseio.com",
  projectId: "control-f7416",
  storageBucket: "control-f7416.firebasestorage.app",
  messagingSenderId: "212032265098",
  appId: "1:212032265098:web:14bf7575bf75c66f9bc673"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASSWORD = "admin123";
const RESET_PASSWORD = "admin2";

// 🔥 NUEVO: recuperar datos guardados
let esAdmin = localStorage.getItem("modoAdmin") === "true";
let tiempoInicio = parseInt(localStorage.getItem("tiempoInicio")) || null;
let tiempoRestante = parseInt(localStorage.getItem("tiempoRestante")) || 60;

let temporizador = null;
let bloqueado = localStorage.getItem("bloqueado") === "true";

// ================= TIMER =================
function actualizarTimer(){
  document.getElementById("timer").innerText = tiempoRestante;
  localStorage.setItem("tiempoRestante", tiempoRestante);
}

function iniciarTemporizador(){

  if(!tiempoInicio){
    tiempoInicio = Date.now();
    localStorage.setItem("tiempoInicio", tiempoInicio);
  }

  temporizador = setInterval(()=>{
    const ahora = Date.now();
    const segundosPasados = Math.floor((ahora - tiempoInicio)/1000);
    tiempoRestante = 60 - segundosPasados;

    if(tiempoRestante <= 0){
      tiempoRestante = 0;
      actualizarTimer();
      clearInterval(temporizador);
      bloquearSistema();
      return;
    }

    actualizarTimer();
  },1000);
}

function detenerTemporizador(){
  if(temporizador){
    clearInterval(temporizador);
    temporizador = null;
  }
}

// ================= BLOQUEO GENERAL =================
function bloquearSistema(){
  bloqueado = true;
  localStorage.setItem("bloqueado","true");
  document.getElementById("bloqueo").style.display="flex";
}

function desbloquearSistema(){
  bloqueado = false;
  localStorage.setItem("bloqueado","false");

  tiempoInicio = null;
  tiempoRestante = 60;
  localStorage.removeItem("tiempoInicio");
  localStorage.setItem("tiempoRestante",60);

  actualizarTimer();
  document.getElementById("bloqueo").style.display="none";
}

// ================= ENVÍO =================
function enviar(ruta, valor){
  if(bloqueado) return;

  if(!esAdmin && temporizador === null){
      iniciarTemporizador();
  }

  set(ref(db,ruta),valor);
}

window.enviarGrupo1 = v => enviar("grupo1",v);
window.enviarGrupo2 = v => enviar("grupo2",v);

// ================= LOGIN =================
window.login = function(){
  const pass = document.getElementById("password").value;
  if(pass === ADMIN_PASSWORD){
      esAdmin = true;
      localStorage.setItem("modoAdmin","true");

      detenerTemporizador();
      document.getElementById("timerContainer").style.display="none";

      document.getElementById("adminPanel").style.display="block";
      document.getElementById("loginBox").style.display="none";
      document.getElementById("password").value="";
  } else {
      alert("Contraseña incorrecta");
      document.getElementById("password").value="";
  }
};

// ================= SALIR ADMIN =================
window.salirAdmin = function(){
  esAdmin = false;
  localStorage.setItem("modoAdmin","false");

  document.getElementById("timerContainer").style.display="block";
  document.getElementById("adminPanel").style.display="none";
  document.getElementById("loginBox").style.display="block";
};

// ================= DESBLOQUEO ADMIN =================
window.desbloqueoAdmin = function(){
  const pass = document.getElementById("adminUnlock").value;
  if(pass === ADMIN_PASSWORD){
      desbloquearSistema();
      document.getElementById("adminUnlock").value="";
  } else {
      alert("Contraseña incorrecta");
      document.getElementById("adminUnlock").value="";
  }
};

// ================= ADMIN CONTROLES =================
window.controlAdmin = function(num){
  if(!esAdmin) return;
  if(num==1){ enviar("grupo1",1); enviar("grupo2",5); }
  if(num==2){ enviar("grupo1",2); enviar("grupo2",6); }
  if(num==3){ enviar("grupo1",3); enviar("grupo2",7); }
  if(num==4){ enviar("grupo1",4); enviar("grupo2",8); }
};

// ================= LIKES =================
const likesRef = ref(db,"likes");
const dislikesRef = ref(db,"dislikes");

onValue(likesRef, s=>{
  document.getElementById("likes").innerText = s.val() || 0;
});
onValue(dislikesRef, s=>{
  document.getElementById("dislikes").innerText = s.val() || 0;
});

window.darLike = async ()=>{
  const snap = await get(likesRef);
  await set(likesRef,(snap.val()||0)+1);
};

window.darDislike = async ()=>{
  const snap = await get(dislikesRef);
  await set(dislikesRef,(snap.val()||0)+1);
};

// ================= RESET LIKES =================
window.resetReacciones = async function(){
  const pass = prompt("Ingrese contraseña para reiniciar reacciones:");
  
  if(pass === RESET_PASSWORD){
      await set(likesRef, 0);
      await set(dislikesRef, 0);
      alert("Reacciones reiniciadas correctamente");
  } else {
      alert("Contraseña incorrecta");
  }
};

// ================= CARGA INICIAL =================
window.onload = function(){

  actualizarTimer();

  // 🔥 mantener modo admin si recarga
  if(esAdmin){
      document.getElementById("adminPanel").style.display="block";
      document.getElementById("loginBox").style.display="none";
      document.getElementById("timerContainer").style.display="none";
  } else {
      if(tiempoInicio && !bloqueado){
          iniciarTemporizador();
      }
  }

  if(bloqueado){
    document.getElementById("bloqueo").style.display="flex";
  }
};
</script>
